services:
  streamlit:
    build: .
    ports:
      - "8513:8513"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PYTHONPATH=/app/src
    command: >
      streamlit run app/streamlit_app.py
      --server.port=8513
      --server.address=0.0.0.0

  api:
    build: .
    ports:
      - "8713:8713"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PYTHONPATH=/app/src
    command: >
      uvicorn predictive_maintenance.api:app
      --host 0.0.0.0
      --port 8713
    profiles:
      - api
